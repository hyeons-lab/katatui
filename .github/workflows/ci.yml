name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run Quality Checks
        run: |
          ./gradlew ktfmtCheck detekt --no-build-cache

  apple:
    name: Apple Targets
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get Kotlin version
        id: kotlin-version
        run: |
          KOTLIN=$(grep '^kotlin ' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$KOTLIN" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS targets + Swift sample
        run: |
          ./gradlew :katatui:compileKotlinMacosArm64 \
            :katatui:compileKotlinMacosX64 \
            :sample-app:compileKotlinMacosArm64 \
            buildSwiftSample \
            --configuration-cache

  linux:
    name: Linux Targets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get Kotlin version
        id: kotlin-version
        run: |
          KOTLIN=$(grep '^kotlin ' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$KOTLIN" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Linux targets
        run: |
          ./gradlew :katatui:compileKotlinLinuxX64 \
            :katatui:compileKotlinLinuxArm64 \
            :sample-app:compileKotlinLinuxX64 \
            --configuration-cache

  windows:
    name: Windows Targets
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get Kotlin version
        id: kotlin-version
        shell: bash
        run: |
          KOTLIN=$(grep '^kotlin ' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$KOTLIN" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows targets
        shell: bash
        run: |
          ./gradlew :katatui:compileKotlinMingwX64 \
            :sample-app:compileKotlinMingwX64 \
            --configuration-cache

  smoke-test:
    name: Smoke Test (Linkage)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get Kotlin version
        id: kotlin-version
        run: |
          KOTLIN=$(grep '^kotlin ' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$KOTLIN" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Verify Bundled Linkage (Kotlin & Swift)
        run: |
          # This specifically tests that the klib and XCFramework bundle the Rust static lib.
          # If they don't, these link tasks will fail because we removed explicit -lkatatui_ffi
          # from the sample app build scripts.
          ./gradlew :sample-app:linkReleaseExecutableMacosArm64 \
            buildSwiftSample \
            --configuration-cache
