[package]
name    = "katatui-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
ratatui        = { version = "0.30", features = ["crossterm"] }
crossterm      = "0.28"
ratatui-image  = { version = "10", default-features = false }
image          = "0.25"

[build-dependencies]
cbindgen = "0.27"
